name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test website files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          echo "All required website files are present."

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deployment package
        run: |
          mkdir build
          cp index.html build/
          cp styles.css build/
          cp script.js build/

      - name: Verify build
        run: |
          ls -la build

      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: website-build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::598628178437:role/GitHubActions-S3-Deployment-Role
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 sync build/ s3://devops-cicd-assignment-anand50ad --delete
