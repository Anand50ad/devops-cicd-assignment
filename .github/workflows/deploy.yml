name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show project files
        run: |
          echo "Files in repository:"
          ls -la

      - name: Test website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required website files are present."
