name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test website files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          echo "All required website files are present."

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deployment package
        run: |
          mkdir build
          cp index.html build/
          cp styles.css build/
          cp script.js build/

      - name: Verify build
        run: |
          ls -la build
